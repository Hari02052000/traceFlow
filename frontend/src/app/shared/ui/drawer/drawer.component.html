@if (open) {
  <div class="drawer-backdrop" (click)="closeFromBackdrop()">
    <aside [class]="'drawer drawer--' + position" role="dialog" aria-modal="true" [attr.aria-label]="title || 'Side panel'" (click)="$event.stopPropagation()">
      <header class="drawer__header">
        @if (title) { <h2 class="drawer__title">{{ title }}</h2> }
        <button class="drawer__close" type="button" aria-label="Close panel" (click)="closed.emit()">×</button>
      </header>
      <div class="drawer__body"><ng-content /></div>
      <footer class="drawer__footer"><ng-content select="[drawer-footer]" /></footer>
    </aside>
  </div>
}

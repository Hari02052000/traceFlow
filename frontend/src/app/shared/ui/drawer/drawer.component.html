@if (open) {
  <div [class.justify-start]="position === 'left'" class="fixed inset-0 z-[var(--z-index-overlay)] flex justify-end bg-tf-overlay" (click)="closeFromBackdrop()">
    <aside class="flex h-full w-full max-w-[min(24rem,88vw)] flex-col bg-tf-surface text-tf-primary shadow-tf-lg" role="dialog" aria-modal="true" [attr.aria-label]="title || 'Side panel'" (click)="$event.stopPropagation()">
      <header class="flex min-h-16 items-center justify-between gap-tf-3 border-b border-tf-border px-tf-5">
        @if (title) { <h2 class="m-0 text-lg leading-tight font-semibold">{{ title }}</h2> }
        <button class="cursor-pointer rounded-tf-sm border-0 bg-transparent p-tf-1 text-2xl leading-none text-tf-secondary hover:bg-tf-surface-subtle hover:text-tf-primary focus-visible:outline-2 focus-visible:outline-tf-focus focus-visible:outline-offset-2" type="button" aria-label="Close panel" (click)="closed.emit()">×</button>
      </header>
      <div class="flex-1 overflow-y-auto p-tf-5"><ng-content /></div>
      <footer class="empty:hidden border-t border-tf-border px-tf-5 py-tf-4"><ng-content select="[drawer-footer]" /></footer>
    </aside>
  </div>
}

<section class="empty-state">
  <div class="empty-state__illustration" aria-hidden="true"><ng-content select="[empty-state-icon]" /></div>
  <div class="empty-state__content">
    <h2 class="empty-state__title">{{ title }}</h2>
    @if (description) { <p class="empty-state__description">{{ description }}</p> }
  </div>
  <div class="empty-state__action"><ng-content select="[empty-state-action]" /></div>
</section>

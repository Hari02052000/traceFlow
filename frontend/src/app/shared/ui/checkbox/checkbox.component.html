<label class="checkbox" [attr.for]="inputId || null">
  <input class="checkbox__input" type="checkbox" [id]="inputId || null" [checked]="value() ?? false" [disabled]="disabled()" [attr.aria-describedby]="describedBy || null" (change)="onCheckboxChange($event)" (blur)="markAsTouched()" />
  <span class="checkbox__control" aria-hidden="true"></span>
  <span class="checkbox__label">{{ label }}</span>
</label>

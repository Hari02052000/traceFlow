<section [class]="variantClasses[variant]" class="flex items-start justify-between gap-tf-3 rounded-tf-md border px-tf-4 py-tf-3" role="alert">
  <div class="grid gap-tf-1">
    @if (title) { <h2 class="m-0 text-sm leading-normal font-semibold text-tf-primary">{{ title }}</h2> }
    <div class="text-sm leading-normal text-tf-secondary"><ng-content /></div>
  </div>
  @if (dismissible) {
    <button class="cursor-pointer rounded-tf-sm border-0 bg-transparent p-0 text-xl leading-none text-current focus-visible:outline-2 focus-visible:outline-tf-focus focus-visible:outline-offset-2" type="button" aria-label="Dismiss alert" (click)="dismissed.emit()">×</button>
  }
</section>

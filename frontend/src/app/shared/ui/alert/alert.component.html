<section [class]="'alert alert--' + variant" role="alert">
  <div class="alert__content">
    @if (title) { <h2 class="alert__title">{{ title }}</h2> }
    <div class="alert__message"><ng-content /></div>
  </div>
  @if (dismissible) {
    <button class="alert__dismiss" type="button" aria-label="Dismiss alert" (click)="dismissed.emit()">×</button>
  }
</section>

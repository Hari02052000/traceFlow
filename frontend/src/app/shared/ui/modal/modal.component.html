@if (open) {
  <div class="modal-backdrop" (click)="closeFromBackdrop()">
    <section [class]="'modal modal--' + size" role="dialog" aria-modal="true" [attr.aria-label]="title || 'Dialog'" (click)="$event.stopPropagation()">
      <header class="modal__header">
        @if (title) { <h2 class="modal__title">{{ title }}</h2> }
        <button class="modal__close" type="button" aria-label="Close dialog" (click)="closed.emit()">×</button>
      </header>
      <div class="modal__body"><ng-content /></div>
      <footer class="modal__footer"><ng-content select="[modal-footer]" /></footer>
    </section>
  </div>
}

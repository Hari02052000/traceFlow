<input
  class="box-border min-h-10 w-full rounded-tf-md border border-tf-border bg-tf-surface px-tf-3 py-tf-2 font-sans leading-normal text-tf-primary outline-none transition-[border-color,box-shadow] placeholder:text-tf-tertiary hover:border-tf-border-strong focus:border-tf-focus focus:ring-3 focus:ring-tf-surface-selected aria-[invalid=true]:border-tf-danger disabled:cursor-not-allowed disabled:bg-tf-surface-subtle"
  [id]="inputId || null"
  [type]="type"
  [value]="value() ?? ''"
  [placeholder]="placeholder"
  [autocomplete]="autocomplete"
  [disabled]="disabled()"
  [attr.aria-invalid]="invalid || null"
  [attr.aria-describedby]="describedBy || null"
  (input)="onInput($event)"
  (blur)="markAsTouched()"
/>

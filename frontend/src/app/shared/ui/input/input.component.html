<input
  class="input"
  [id]="inputId || null"
  [type]="type"
  [value]="value() ?? ''"
  [placeholder]="placeholder"
  [autocomplete]="autocomplete"
  [disabled]="disabled()"
  [attr.aria-invalid]="invalid || null"
  [attr.aria-describedby]="describedBy || null"
  (input)="onInput($event)"
  (blur)="markAsTouched()"
/>

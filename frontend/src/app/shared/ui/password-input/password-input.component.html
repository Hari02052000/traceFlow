<div class="relative">
  <input class="box-border min-h-10 w-full rounded-tf-md border border-tf-border bg-tf-surface py-tf-2 pr-tf-10 pl-tf-3 font-sans leading-normal text-tf-primary outline-none transition-[border-color,box-shadow] placeholder:text-tf-tertiary hover:border-tf-border-strong focus:border-tf-focus focus:ring-3 focus:ring-tf-surface-selected aria-[invalid=true]:border-tf-danger disabled:cursor-not-allowed disabled:bg-tf-surface-subtle" [id]="inputId || null" [type]="visible ? 'text' : 'password'" [value]="value() ?? ''" [placeholder]="placeholder" [autocomplete]="autocomplete" [disabled]="disabled()" [attr.aria-invalid]="invalid || null" [attr.aria-describedby]="describedBy || null" (input)="onInput($event)" (blur)="markAsTouched()" />
  <button class="absolute top-1/2 right-tf-2 -translate-y-1/2 cursor-pointer rounded-tf-sm border-0 bg-transparent p-tf-1 text-xs font-semibold text-tf-link focus-visible:outline-2 focus-visible:outline-tf-focus focus-visible:outline-offset-2 disabled:cursor-not-allowed disabled:opacity-55" type="button" [disabled]="disabled()" [attr.aria-label]="visible ? 'Hide password' : 'Show password'" (click)="toggleVisibility()">{{ visible ? 'Hide' : 'Show' }}</button>
</div>

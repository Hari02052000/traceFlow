<div class="password-input">
  <input class="password-input__control" [id]="inputId || null" [type]="visible ? 'text' : 'password'" [value]="value() ?? ''" [placeholder]="placeholder" [autocomplete]="autocomplete" [disabled]="disabled()" [attr.aria-invalid]="invalid || null" [attr.aria-describedby]="describedBy || null" (input)="onInput($event)" (blur)="markAsTouched()" />
  <button class="password-input__toggle" type="button" [disabled]="disabled()" [attr.aria-label]="visible ? 'Hide password' : 'Show password'" (click)="toggleVisibility()">{{ visible ? 'Hide' : 'Show' }}</button>
</div>

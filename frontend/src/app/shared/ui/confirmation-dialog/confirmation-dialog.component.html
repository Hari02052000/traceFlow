<app-modal [open]="open" [title]="title" size="sm" (closed)="cancelled.emit()">
  <p class="m-0 leading-relaxed text-tf-secondary">{{ message }}</p>
  <div modal-footer class="flex flex-wrap justify-end gap-tf-3">
    <app-button variant="secondary" (pressed)="cancelled.emit()">{{ cancelLabel }}</app-button>
    <app-button [variant]="variant" (pressed)="confirmed.emit()">{{ confirmLabel }}</app-button>
  </div>
</app-modal>
